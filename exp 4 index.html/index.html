 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Room Booking Form</title>
</head>
<body>

<h1 align="center">Hotel Room Booking Form</h1>

<form action="#" method="post" align="center">
  <p align="center">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" size="30">
  </p>

  <p align="center">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" size="30">
  </p>

  <p align="center">
    <label for="phone">Phone:</label>
    <input type="tel" id="phone" name="phone" size="30">
  </p>

  <p align="center">
    <label for="checkin">Check-in Date:</label>
    <input type="date" id="checkin" name="checkin">
  </p>

  <p align="center">
    <label for="checkout">Check-out Date:</label>
    <input type="date" id="checkout" name="checkout">
  </p>

  <p align="center">
    <label for="room">Room Type:</label>
    <select id="room" name="room">
      <option value="single">Single Room</option>
      <option value="double">Double Room</option>
      <option value="deluxe">Deluxe Room</option>
      <option value="suite">Suite</option>
    </select>
  </p>

  <p align="center">
    <label for="guests">Number of Guests:</label>
    <input type="number" id="guests" name="guests" min="1" size="6" style="width:70px">
  </p>

  <p align="center">
    <label for="requests">Special Requests:</label><br>
    <textarea id="requests" name="requests" rows="5" cols="60"></textarea>
  </p>

  <p align="center">
    <input type="submit" value="Book Now">
    <input type="reset" value="Reset Form">
  </p>
</form>
   
</body>
</html>
